spring:
  security:
    oauth2:

      client:
        registration:
          keycloak:
            client-id: gateway-api
            client-secret: nvNLuTbhsyaMQwazkRFImAByzeuEBRwS
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/backend-dev
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/backend-dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: flow-manager
            uri: lb://FLOW-MANAGER
            predicates:
              - Path=/api/v1/flow-manager/**
            filters:
              - AddRequestHeader=X-User-Login, user-from-token

  application:
    name: Api-Gateway


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 9090
